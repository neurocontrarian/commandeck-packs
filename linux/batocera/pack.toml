version = 1

[pack]
pack_id = "batocera"
name = "Batocera"
pack_ver = "1.0.6"
os = "linux"
category = "Batocera"
description = "The retro gaming box under the TV, answered from your desk or your phone: which game is running, why one refused to start, what fills the disk, which pads are seen - plus close a stuck game, rescue a black screen and shut down cleanly."
requires = "A Batocera machine reachable over SSH. Batocera logs you in as root, so no sudo and no admin password is involved. These commands are Batocera-specific: they will not work on a normal Linux server."
tags = ["batocera", "retro-gaming", "emulation", "ssh", "diagnostics"]

# ── Questions (most of the value is here) ─────────────────────────────────
[[button]]
id = "bat-010"
name = "Batocera system info"
command = '''es=""; for p in /proc/[0-9]*; do [ -r "$p/comm" ] || continue; case "$(cat "$p/comm" 2>/dev/null)" in emulationstatio*) es=$p; break;; esac; done; if [ -n "$es" ] && [ -r "$es/environ" ]; then eval "$(tr '\0' '\n' < "$es/environ" | grep -E '^(DISPLAY|XAUTHORITY)=[^ ]+$' | sed 's/^/export /')"; fi; export DISPLAY="${DISPLAY:-:0}"; if [ -z "${XAUTHORITY:-}" ]; then for x in /root/.Xauthority /userdata/system/.Xauthority; do [ -r "$x" ] && { XAUTHORITY="$x"; export XAUTHORITY; break; }; done; fi; batocera-info; echo; echo "=== Uptime and load ==="; uptime'''
icon_name = "info-circle"
color = "#62a0ea"
show_output = true
category = "Batocera"
os = "linux"
tooltip = "Which Batocera version, which machine, how hot the processor is and how much memory is left - the same summary Batocera prints when you log in."

[[button]]
id = "bat-020"
name = "Debug (es_launch_stderr.log)"
command = '''f=/userdata/system/logs/es_launch_stderr.log; if [ ! -s "$f" ]; then echo "Nothing recorded yet: $f is empty or missing."; echo "This log fills up each time a game is launched, so an empty one means nothing has been started since the last reboot."; exit 0; fi; echo "=== Suspicious lines from the last launch ==="; err=$(grep -iE "error|failed|missing|not found|no such file|denied|unsupported|segmentation" "$f" | tail -15); if [ -n "$err" ]; then echo "$err"; else echo "None - as far as this log goes, the last game started fine."; fi; echo; echo "=== Last 25 lines, raw ==="; tail -25 "$f"'''
icon_name = "exclamation-triangle"
color = "#ffbe6f"
show_output = true
category = "Batocera"
os = "linux"
tooltip = "Batocera keeps the output of the last game it launched. A missing BIOS file, an unsupported ROM format or a wrong permission shows up here - and if nothing looks wrong, it says so."

[[button]]
id = "bat-025"
name = "Debug (es_log.txt)"
command = '''f=""; for c in /userdata/system/configs/emulationstation/es_log.txt /userdata/system/logs/es_log.txt; do [ -s "$c" ] && { f=$c; break; }; done; if [ -z "$f" ]; then for c in $(find /userdata/system -maxdepth 4 -name "es_log*.txt" 2>/dev/null); do [ -s "$c" ] && { f=$c; break; }; done; fi; if [ -z "$f" ]; then echo "EmulationStation is not writing a log on this box right now."; echo; echo "Turn it on, then run this button again:"; echo "  MAIN MENU > SYSTEM SETTINGS > FRONTEND DEVELOPER SETTINGS > LOG LEVEL"; echo "  set it to debug, then use the \"Restart the menu\" button."; echo; echo "=== Logs that DO exist right now ==="; out=$(ls -lt /userdata/system/logs/ 2>/dev/null | tail -n +2 | head -12); [ -n "$out" ] && echo "$out" || echo "None - /userdata/system/logs/ is empty or missing."; exit 0; fi; echo "File: $f"; ls -l "$f" | awk '{print "Last written: " $6 " " $7 " " $8}'; echo; echo "=== Suspicious lines ==="; err=$(grep -iE "error|failed|warn|missing|not found|no such file|denied|unable|exception" "$f" | tail -15); if [ -n "$err" ]; then echo "$err"; else echo "None - EmulationStation logged nothing that looks like trouble."; fi; echo; echo "=== Last 30 lines, raw ==="; tail -30 "$f"; echo; echo "This is the file Batocera support asks for first. Use Copy to paste it into your post."'''
icon_name = "journal-text"
color = "#ffbe6f"
show_output = true
category = "Batocera"
os = "linux"
tooltip = "The log of the menu itself - the one Batocera support asks for first. Scraping, a system that will not appear, a theme that breaks, a slow start: it is written here, not in the launch log."

[[button]]
id = "bat-026"
name = "Why a game won't start"
command = '''f=/userdata/system/logs/es_launch_stderr.log; echo "Start a game on the TV now - whatever it writes appears below."; echo "Press Ctrl+C - or just leave this view - when you have seen enough."; echo; [ -e "$f" ] || : > "$f" 2>/dev/null; tail -n 20 -f "$f"'''
icon_name = "activity"
color = "#ffbe6f"
execution_mode = "terminal"
category = "Batocera"
os = "linux"
tooltip = "Open it, then start the game on the TV: Batocera writes here as it launches, so a failure appears the moment it happens. When all is well, almost nothing appears - that is the good answer."

[[button]]
id = "bat-030"
name = "Is a game running right now?"
command = '''game=""; for p in /proc/[0-9]*; do [ -r "$p/cmdline" ] || continue; c=$(tr '\0' '\n' < "$p/cmdline" 2>/dev/null | grep -m1 "^/userdata/roms/"); if [ -n "$c" ]; then game="$c"; break; fi; done; if [ -n "$game" ]; then sys=$(echo "$game" | cut -d/ -f4); title=$(basename "$game" | sed 's/\.[^.]*$//'); echo "Yes - a game is running:"; echo; echo "  Game:   $title"; echo "  System: $sys"; elif pgrep -f "[r]etroarch" >/dev/null 2>&1 || pgrep -f "[e]mulatorlauncher" >/dev/null 2>&1; then echo "An emulator is running, but its game file is not one I can name."; else echo "No game running - the box is sitting in the EmulationStation menu."; fi'''
icon_name = "activity"
color = "#8ff0a4"
show_output = true
category = "Batocera"
os = "linux"
tooltip = "Names the game being played and the console it belongs to - so you know whether someone is in the middle of something before you restart anything."

[[button]]
id = "bat-040"
name = "Free space"
command = '''echo "=== Free space ==="; df -h /userdata 2>/dev/null; echo; echo "=== Biggest folders in /userdata ==="; out=$(du -sm /userdata/* 2>/dev/null | sort -rn | head -10 | awk '{v=$1+0; u="MB"; if(v>=1000){v/=1024; u="GB"} if(v>=1000){v/=1024; u="TB"} n=$2; sub(/.*\//,"",n); printf "%8.1f %-2s  %s\n", v, u, n}'); [ -n "$out" ] && echo "$out" || echo "Could not measure the folders."'''
icon_name = "hdd"
color = "#62a0ea"
show_output = true
category = "Batocera"
os = "linux"
tooltip = "Everything you add lives in /userdata - ROMs, saves, screenshots, BIOS. This is the partition that fills up, and the folders that fill it."

[[button]]
id = "bat-050"
name = "Which systems eat my disk?"
command = '''[ -d /userdata/roms ] || { echo "No /userdata/roms folder on this machine - is this really a Batocera box?"; exit 0; }; echo "Size of each console's ROM folder, biggest first:"; echo; out=$(du -sm /userdata/roms/* 2>/dev/null | sort -rn | head -20 | awk '{v=$1+0; u="MB"; if(v>=1000){v/=1024; u="GB"} if(v>=1000){v/=1024; u="TB"} n=$2; sub(/.*\//,"",n); printf "%8.1f %-2s  %s\n", v, u, n}'); [ -n "$out" ] && echo "$out" || echo "No ROMs installed yet."'''
icon_name = "folder2"
color = "#62a0ea"
show_output = true
category = "Batocera"
os = "linux"
tooltip = "Before buying a bigger disk, see which console is actually taking the room."

[[button]]
id = "bat-055"
name = "Browse the disk (ncdu)"
command = '''command -v ncdu >/dev/null 2>&1 || { echo "ncdu is not part of this Batocera build, and Batocera is read-only outside /userdata, so it cannot be installed."; echo "Use the \"Which systems eat my disk?\" button instead."; exit 1; }; ncdu /userdata'''
icon_name = "folder2"
color = "#8ff0a4"
execution_mode = "terminal"
category = "Batocera"
os = "linux"
tooltip = "Walk through /userdata folder by folder with the arrow keys and delete what you no longer want, instead of reading a list of sizes. The arrow keys only exist on a computer, so this one is not for the phone."

[[button]]
id = "bat-060"
name = "My controllers"
command = '''list=$(awk 'BEGIN{RS="";FS="\n"} /Handlers=.*js[0-9]/ {name=""; for(i=1;i<=NF;i++) if($i ~ /^N: Name=/){name=$i; sub(/^N: Name="?/,"",name); sub(/"$/,"",name)} if(name!="") print "  - " name}' /proc/bus/input/devices 2>/dev/null); if [ -n "$list" ]; then echo "Controllers Batocera can see:"; echo; echo "$list"; else echo "No controller detected right now. A Bluetooth pad only shows up once it is connected and awake."; fi; first=1; for d in /sys/class/power_supply/*; do [ -r "$d/capacity" ] || continue; n=$(basename "$d"); case "$n" in *ontroller*|*sony*|*xbox*|*hid*|*gamepad*) [ "$first" = 1 ] && { echo; echo "Battery:"; first=0; }; echo "  $n: $(cat "$d/capacity")%";; esac; done; exit 0'''
icon_name = "plug"
color = "#8ff0a4"
show_output = true
category = "Batocera"
os = "linux"
tooltip = "Which pads Batocera actually sees, by name, plus the battery level of a wireless one when the kernel reports it. The first thing to check when a controller does nothing in a game."

[[button]]
id = "bat-065"
name = "Disconnect the wireless pads"
command = '''command -v bluetoothctl >/dev/null 2>&1 || { echo "bluetoothctl is not on this machine, so wireless devices cannot be disconnected from here."; exit 1; }; macs=$(bluetoothctl devices Connected 2>/dev/null | awk '/^Device /{print $2}'); if [ -z "$macs" ]; then macs=$(bluetoothctl paired-devices 2>/dev/null | awk '/^Device /{print $2}' | while read -r m; do bluetoothctl info "$m" 2>/dev/null | grep -qi "connected: yes" && echo "$m"; done); fi; if [ -z "$macs" ]; then echo "No wireless device is connected right now."; echo; echo "A USB pad cannot be switched off this way - unplug it."; exit 0; fi; for m in $macs; do name=$(bluetoothctl info "$m" 2>/dev/null | sed -n "s/^[[:space:]]*Name: //p" | head -1); echo "Disconnecting ${name:-$m}"; bluetoothctl disconnect "$m" >/dev/null 2>&1; done; sleep 3; left=$(bluetoothctl devices Connected 2>/dev/null | awk '/^Device /{print $2}'); echo; if [ -z "$left" ]; then echo "Done - a pad powers itself off a few seconds after losing the connection."; else echo "Still connected:"; for m in $left; do n=$(bluetoothctl info "$m" 2>/dev/null | sed -n "s/^[[:space:]]*Name: //p" | head -1); echo "  ${n:-$m}"; done; echo "Hold its home button down, or wait for it to sleep on its own."; fi'''
icon_name = "plug"
color = "#ffa348"
show_output = true
confirm_before_run = true
category = "Batocera"
os = "linux"
tooltip = "Switches off every Bluetooth device connected to the box - pads left on under the sofa stop draining their battery, and a pad stuck in a game lets go. Turn one back on with its home button. This also drops a Bluetooth headset if one is connected; a USB pad is unaffected."

[[button]]
id = "bat-070"
name = "What is my screen doing?"
command = '''es=""; for p in /proc/[0-9]*; do [ -r "$p/comm" ] || continue; case "$(cat "$p/comm" 2>/dev/null)" in emulationstatio*) es=$p; break;; esac; done; if [ -n "$es" ] && [ -r "$es/environ" ]; then eval "$(tr '\0' '\n' < "$es/environ" | grep -E '^(DISPLAY|XAUTHORITY)=[^ ]+$' | sed 's/^/export /')"; fi; export DISPLAY="${DISPLAY:-:0}"; if [ -z "${XAUTHORITY:-}" ]; then for x in /root/.Xauthority /userdata/system/.Xauthority; do [ -r "$x" ] && { XAUTHORITY="$x"; export XAUTHORITY; break; }; done; fi; [ -n "${XAUTHORITY:-}" ] || echo "(No screen authorisation found - the answers below may be blank or incomplete.)"; echo "=== Resolution being sent to the screen ==="; batocera-resolution currentResolution; echo; echo "=== Current mode ==="; batocera-resolution currentMode; echo; echo "=== Outputs the box can see ==="; batocera-resolution listOutputs; echo; echo "=== Modes your screen accepts ==="; batocera-resolution listModes'''
icon_name = "pc-display"
color = "#62a0ea"
show_output = true
category = "Batocera"
os = "linux"
tooltip = "Everything about the display in one click: what is being sent, on which output, and the exact list of modes to pick from for the next button."

# ── Actions ───────────────────────────────────────────────────────────────
[[button]]
id = "bat-080"
name = "Set the display mode"
command = '''es=""; for p in /proc/[0-9]*; do [ -r "$p/comm" ] || continue; case "$(cat "$p/comm" 2>/dev/null)" in emulationstatio*) es=$p; break;; esac; done; if [ -n "$es" ] && [ -r "$es/environ" ]; then eval "$(tr '\0' '\n' < "$es/environ" | grep -E '^(DISPLAY|XAUTHORITY)=[^ ]+$' | sed 's/^/export /')"; fi; export DISPLAY="${DISPLAY:-:0}"; if [ -z "${XAUTHORITY:-}" ]; then for x in /root/.Xauthority /userdata/system/.Xauthority; do [ -r "$x" ] && { XAUTHORITY="$x"; export XAUTHORITY; break; }; done; fi; modes=$(batocera-resolution listModes 2>/dev/null); if ! echo "$modes" | cut -d: -f1 | grep -qx "{{mode}}"; then echo "'{{mode}}' is not one of the modes this screen accepts, so nothing was changed."; echo; echo "Pick one from this list - the part before the colon is what to type:"; echo; echo "$modes"; exit 1; fi; batocera-resolution setMode "{{mode}}" || exit $?; sleep 2; printf "Asked for: %s\n" "{{mode}}"; printf "Now showing: "; batocera-resolution currentResolution'''
icon_name = "pc-display-horizontal"
color = "#f8e45c"
show_output = true
confirm_before_run = true
category = "Batocera"
os = "linux"
tooltip = "The black-screen rescue: the TV shows nothing because a mode it cannot display got selected, and you fix it from your phone instead of hunting for a keyboard. A mode that your screen does not accept is refused and the valid list is shown, so a wrong guess changes nothing."

[[button]]
id = "bat-090"
name = "Close the running game"
command = '''command -v batocera-es-swissknife >/dev/null || { echo "batocera-es-swissknife not found - this machine does not look like a Batocera box." >&2; exit 1; }; game=""; for p in /proc/[0-9]*; do [ -r "$p/cmdline" ] || continue; c=$(tr '\0' '\n' < "$p/cmdline" 2>/dev/null | grep -m1 "^/userdata/roms/"); if [ -n "$c" ]; then game=$(basename "$c" | sed 's/\.[^.]*$//'); break; fi; done; if [ -n "$game" ]; then echo "Closing: $game"; elif pgrep -f "[r]etroarch" >/dev/null 2>&1 || pgrep -f "[e]mulatorlauncher" >/dev/null 2>&1; then echo "Closing the running emulator."; else echo "No game was running - nothing to close."; exit 0; fi; batocera-es-swissknife --emukill; sleep 3; if pgrep -f "[r]etroarch" >/dev/null 2>&1 || pgrep -f "[e]mulatorlauncher" >/dev/null 2>&1; then echo "The emulator is still running. Try 'Restart the menu', then a reboot."; else echo "Done - you should be back in the menu."; fi'''
icon_name = "power"
color = "#ffa348"
show_output = true
confirm_before_run = true
category = "Batocera"
os = "linux"
tooltip = "A frozen emulator with a controller that no longer responds: this closes it and hands the menu back, without rebooting the box. Unsaved progress in that game is lost."

[[button]]
id = "bat-100"
name = "Restart the menu"
command = '''echo "Restarting EmulationStation - the screen goes black for a few seconds."; batocera-es-swissknife --restart'''
icon_name = "arrow-clockwise"
color = "#f8e45c"
show_output = true
confirm_before_run = true
category = "Batocera"
os = "linux"
tooltip = "Second step when the interface itself is stuck, or after adding ROMs so they appear. Lighter than a reboot - anything being played is closed."

[[button]]
id = "bat-110"
name = "Live monitor (htop)"
command = '''command -v htop >/dev/null 2>&1 && exec htop; command -v top >/dev/null 2>&1 && exec top; echo "Neither htop nor top is on this Batocera build."; echo "Use the \"Batocera system info\" button for a one-shot summary."; exit 1'''
icon_name = "cpu"
color = "#8ff0a4"
execution_mode = "terminal"
category = "Batocera"
os = "linux"
tooltip = "CPU, memory and processes updating live while a game runs - the way to see a slowdown as it happens. Falls back to top when htop is absent."

[[button]]
id = "bat-130"
name = "Reboot the box"
command = '''echo "Rebooting now - the box drops off the network for a minute."; batocera-es-swissknife --reboot'''
icon_name = "arrow-clockwise"
color = "#ffa348"
show_output = true
confirm_before_run = true
category = "Batocera"
os = "linux"
tooltip = "A clean restart. The connection is cut while it reboots, so an error at the end of the output is normal, not a failure."

[[button]]
id = "bat-140"
name = "Shut down the box"
command = '''echo "Shutting down now."; batocera-es-swissknife --shutdown'''
icon_name = "power"
color = "#f66151"
show_output = true
confirm_before_run = true
category = "Batocera"
os = "linux"
tooltip = "A proper shutdown instead of pulling the plug - that is what keeps the SD card from being corrupted. The connection is cut as it goes down, so an error at the end is normal."
