version = 1

[pack]
pack_id = "home-assistant-docker"
name = "Home Assistant (Docker)"
pack_ver = "0.9.0"
os = "linux"
category = "Home Assistant"
description = "The questions you would otherwise SSH in for: is it running, is my configuration valid, what failed to start, is my Zigbee stick seen, are backups happening - plus a restart that checks the configuration first and an update that wants a fresh backup. For Home Assistant running in a Docker container."
requires = "Home Assistant Container (the Docker install), reached over SSH by a user allowed to run sudo. The container is found by its image, so it can be called anything. Running Home Assistant OS (the Green, the Yellow, a Raspberry Pi image, a HAOS virtual machine)? This pack is not for you - HAOS has no Docker you can reach."
tags = ["home-assistant", "smart-home", "docker", "selfhosted", "backup", "diagnostics"]

# ── Is it healthy? ────────────────────────────────────────────────────────
[[button]]
id = "has-010"
name = "Is Home Assistant running?"
command = '''sudo docker ps >/dev/null || exit $?; H=$(sudo docker ps -a --format '{{.Names}}|{{.Image}}' | awk -F'|' 'tolower($2) ~ /(^|\/)home-?assistant(:|@|$)/ {print $1; exit}'); [ -n "$H" ] || { echo "No Home Assistant container on this machine."; exit 1; }; sudo docker ps -a --format '{{.Names}}: {{.Status}}' | grep "^$H:"; img=$(sudo docker inspect -f '{{.Config.Image}}' "$H"); v=$(sudo docker inspect -f '{{index .Config.Labels "io.hass.version"}}' "$H" 2>/dev/null); [ -n "$v" ] || v=$(sudo docker inspect -f '{{index .Config.Labels "org.opencontainers.image.version"}}' "$H" 2>/dev/null); echo "Version:   ${v:-unknown}"; echo "Image:     $img"; rc=$(sudo docker inspect -f '{{.RestartCount}}' "$H"); [ "${rc:-0}" -gt 0 ] && echo "Restarted by Docker $rc time(s) since it was created - it has been crashing."; net=$(sudo docker inspect -f '{{.HostConfig.NetworkMode}}' "$H"); echo "Network:   $net"; [ "$net" = host ] || { echo; echo "Note: many devices (Chromecast, Sonos, HomeKit, smart TVs) are only discovered when the container uses network_mode: host."; }; exit 0'''
icon_name = "info-circle"
color = "#62a0ea"
show_output = true
tooltip = "Shows the container, the version it runs, whether Docker had to restart it after crashes, and whether its network setup lets it discover your devices."

[[button]]
id = "has-020"
name = "Is there a newer version?"
command = '''sudo docker ps >/dev/null || exit $?; H=$(sudo docker ps -a --format '{{.Names}}|{{.Image}}' | awk -F'|' 'tolower($2) ~ /(^|\/)home-?assistant(:|@|$)/ {print $1; exit}'); [ -n "$H" ] || { echo "No Home Assistant container on this machine."; exit 1; }; cur=$(sudo docker inspect -f '{{index .Config.Labels "io.hass.version"}}' "$H" 2>/dev/null); [ -n "$cur" ] || cur=$(sudo docker inspect -f '{{index .Config.Labels "org.opencontainers.image.version"}}' "$H" 2>/dev/null); cur=$(printf '%s' "$cur" | grep -oE '[0-9]{4}\.[0-9]+\.[0-9]+' | head -1); img=$(sudo docker inspect -f '{{.Config.Image}}' "$H"); echo "Running:  ${cur:-unknown}"; echo "Image:    $img"; url=https://api.github.com/repos/home-assistant/core/releases/latest; if command -v curl >/dev/null; then js=$(curl -fsS --max-time 15 "$url" 2>&1); elif command -v wget >/dev/null; then js=$(wget -qO- --timeout=15 "$url" 2>&1); else js="(this server has neither curl nor wget)"; fi; new=$(printf '%s' "$js" | sed -n 's/.*"tag_name": *"\([^"]*\)".*/\1/p' | head -1); if [ -z "$new" ]; then echo "Newest:   unknown - GitHub could not be asked from this server."; printf '%s\n' "$js" | head -3; exit 1; fi; echo "Newest:   $new"; echo; if [ -z "$cur" ]; then echo "The running version could not be read, so the two cannot be compared."; elif [ "$cur" = "$new" ]; then echo "You are up to date."; else cy=${cur%%.*}; r=${cur#*.}; cm=${r%%.*}; ny=${new%%.*}; r=${new#*.}; nm=${r%%.*}; behind=$(( (ny - cy) * 12 + nm - cm )); if [ "$behind" -le 0 ]; then echo "A small fix release is available."; else echo "You are $behind monthly release(s) behind."; echo "Before updating, read the Backward-incompatible changes of EACH month you skip:"; echo "https://www.home-assistant.io/blog/categories/release-notes/"; fi; fi; case "$img" in *:*) tag=${img##*:};; *) tag=latest;; esac; echo; case "$tag" in stable|latest) echo "Your setup follows '$tag': Update Home Assistant takes the newest version.";; 20[0-9][0-9].*) echo "Your setup is pinned to exactly $tag: Update Home Assistant changes nothing until that number is changed in your compose file.";; beta|dev|rc) echo "Your setup follows '$tag' - test versions, which can break things.";; esac'''
icon_name = "cloud-download"
color = "#99c1f1"
show_output = true
tooltip = "Compares the version you run with the newest one, counts how many monthly releases you are behind, and points to the notes to read before jumping."

[[button]]
id = "has-030"
name = "Is my configuration valid?"
command = '''sudo docker ps >/dev/null || exit $?; H=$(sudo docker ps --format '{{.Names}}|{{.Image}}' | awk -F'|' 'tolower($2) ~ /(^|\/)home-?assistant(:|@|$)/ {print $1; exit}'); [ -n "$H" ] || { echo "The Home Assistant container is not running, so its checker cannot be started."; exit 1; }; PY=$(sudo docker exec "$H" sh -c 'for p in /lsiopy/bin/python3 /usr/local/bin/python3 python3; do "$p" -c "import homeassistant" 2>/dev/null && { echo "$p"; exit 0; }; done'); [ -n "$PY" ] || { echo "Home Assistant's own checker was not found in this container, so the configuration cannot be checked from here. Use Developer tools > YAML > Check configuration."; exit 1; }; echo "Checking - this takes up to a minute..."; echo; out=$(sudo docker exec "$H" "$PY" -m homeassistant --script check_config --config /config 2>&1); rc=$?; [ -n "$out" ] || { echo "The checker answered nothing at all - treat that as unknown, not as good news."; exit 1; }; printf '%s\n' "$out" | tail -n 60; echo; if [ $rc -ne 0 ] || printf '%s\n' "$out" | grep -qiE 'failed config|invalid config|error'; then echo "PROBLEMS FOUND. Do not restart Home Assistant until they are fixed - it may not come back."; exit 1; elif printf '%s\n' "$out" | grep -qi 'configuration valid'; then echo "Valid. Restarting is safe."; else echo "The checker finished without saying 'valid' - read its report above before restarting."; exit 1; fi'''
icon_name = "file-earmark-diff"
color = "#8ff0a4"
show_output = true
timeout = 300
tooltip = "Runs Home Assistant's own configuration checker. Press it after editing a YAML file and before any restart: a broken file can keep Home Assistant from coming back."

[[button]]
id = "has-040"
name = "Recent errors"
command = '''sudo docker ps >/dev/null || exit $?; H=$(sudo docker ps -a --format '{{.Names}}|{{.Image}}' | awk -F'|' 'tolower($2) ~ /(^|\/)home-?assistant(:|@|$)/ {print $1; exit}'); [ -n "$H" ] || { echo "No Home Assistant container on this machine."; exit 1; }; src="its log file, since it last started"; log=$(sudo docker exec "$H" sh -c '[ -f /config/home-assistant.log ] && tail -n 5000 /config/home-assistant.log' 2>/dev/null); if [ -z "$log" ]; then src="the container output, last 24 hours"; log=$(sudo docker logs --since 24h "$H" 2>&1) || { printf '%s\n' "$log" >&2; exit 1; }; fi; [ -n "$log" ] || { echo "Home Assistant wrote nothing at all ($src). Nothing to judge, which is not the same as all is well."; exit 1; }; hits=$(printf '%s\n' "$log" | grep -E ' (ERROR|WARNING|CRITICAL) '); echo "=== Errors and warnings - $src ==="; echo; if [ -z "$hits" ]; then echo "None in $(printf '%s\n' "$log" | wc -l) lines."; exit 0; fi; printf '%s\n' "$hits" | LC_ALL=C awk '{ k=$0; if (match(k, /(ERROR|WARNING|CRITICAL) /)) k=substr(k, RSTART); sub(/\([A-Za-z0-9_ -]*\) /, "", k); if (!(k in n)) o[++c]=k; n[k]++ } END { for (i=1; i<=c; i++) printf "%s%s\n", o[i], (n[o[i]] > 1 ? sprintf("   (repeated %d times)", n[o[i]]) : "") }' | tail -40; echo; echo "Each message is shown once, with how many times it came back. Copy it into your AI assistant or a forum post as it is."'''
icon_name = "exclamation-triangle"
color = "#ffbe6f"
show_output = true
tooltip = "What went wrong since Home Assistant last started, each message once instead of the same warning 300 times - ready to paste into a forum post or your AI assistant."

[[button]]
id = "has-045"
name = "What failed to start?"
command = '''sudo docker ps >/dev/null || exit $?; H=$(sudo docker ps -a --format '{{.Names}}|{{.Image}}' | awk -F'|' 'tolower($2) ~ /(^|\/)home-?assistant(:|@|$)/ {print $1; exit}'); [ -n "$H" ] || { echo "No Home Assistant container on this machine."; exit 1; }; log=$(sudo docker exec "$H" sh -c '[ -f /config/home-assistant.log ] && cat /config/home-assistant.log' 2>/dev/null); [ -n "$log" ] || log=$(sudo docker logs --since 24h "$H" 2>&1) || { printf '%s\n' "$log" >&2; exit 1; }; [ -n "$log" ] || { echo "Home Assistant wrote nothing since it started, so this cannot be answered."; exit 1; }; echo "=== Integrations that failed to set up ==="; f=$(printf '%s\n' "$log" | grep -E "Setup failed for|Error setting up entry|Error while setting up|Unable to set up|Config entry .* not ready" | sed 's/^.*\] //' | sort | uniq -c | sort -rn | head -20); [ -n "$f" ] && printf '%s\n' "$f" || echo "None - every integration started."; echo; echo "=== Custom integrations installed (HACS and others) ==="; c=$(printf '%s\n' "$log" | grep -oE "custom integration [a-z0-9_]+" | sort -u | sed 's/custom integration /  /'); [ -n "$c" ] && { printf '%s\n' "$c"; echo; echo "After an update, these are the usual suspects: they are not tested by Home Assistant. Update them in HACS first."; } || echo "None."'''
icon_name = "plug"
color = "#ffa348"
show_output = true
tooltip = "After an update or a restart: which integrations did not come back, and which of them are custom ones - those are the usual cause."

[[button]]
id = "has-050"
name = "Follow the log live"
command = '''sudo docker ps >/dev/null || exit $?; H=$(sudo docker ps --format '{{.Names}}|{{.Image}}' | awk -F'|' 'tolower($2) ~ /(^|\/)home-?assistant(:|@|$)/ {print $1; exit}'); [ -n "$H" ] || { echo "The Home Assistant container is not running."; exit 1; }; echo "Do what goes wrong now (a switch, an automation) - Home Assistant writes here as it happens."; echo "Leave this view when you have seen enough."; echo; if sudo docker exec "$H" test -f /config/home-assistant.log; then sudo docker exec "$H" tail -f -n 100 /config/home-assistant.log; else sudo docker logs -f --tail 100 "$H"; fi'''
icon_name = "activity"
color = "#ffbe6f"
execution_mode = "terminal"
tooltip = "The error button shows what already happened; this one keeps printing while you press the switch that does not work, so you see the reason the moment it occurs."

[[button]]
id = "has-060"
name = "Is my Zigbee or Z-Wave stick seen?"
command = '''sudo docker ps >/dev/null || exit $?; H=$(sudo docker ps -a --format '{{.Names}}|{{.Image}}' | awk -F'|' 'tolower($2) ~ /(^|\/)home-?assistant(:|@|$)/ {print $1; exit}'); [ -n "$H" ] || { echo "No Home Assistant container on this machine."; exit 1; }; echo "=== 1. Does the server see a USB stick? ==="; host=$(ls -l /dev/serial/by-id/ 2>/dev/null | awk 'NR > 1 {print $9, $10, $11}'); if [ -n "$host" ]; then printf '%s\n' "$host"; else raw=$(ls /dev/ttyUSB* /dev/ttyACM* 2>/dev/null); if [ -n "$raw" ]; then printf '%s\n' "$raw"; else echo "No. The server sees no USB radio stick at all."; echo "Unplug it and plug it back in. If the server is a virtual machine, the USB device must be passed through to it first."; exit 1; fi; fi; echo; echo "=== 2. Is it given to Home Assistant? ==="; priv=$(sudo docker inspect -f '{{.HostConfig.Privileged}}' "$H"); devs=$(sudo docker inspect "$H" | grep -oE '"PathOnHost": *"[^"]*"' | sed 's/.*"\([^"]*\)"$/\1/'); if [ "$priv" = true ]; then echo "The container runs privileged, so it can reach every device."; elif [ -n "$devs" ]; then printf 'Given to the container: %s\n' $devs; else echo "No device is given to the container."; fi; inside=$(sudo docker exec "$H" sh -c 'ls /dev/serial/by-id/ /dev/ttyUSB* /dev/ttyACM* 2>/dev/null'); echo; if [ -n "$inside" ]; then echo "Inside Home Assistant, these are visible:"; printf '%s\n' "$inside"; echo; echo "Seen. In Home Assistant, pick the /dev/serial/by-id/ name if it is offered - the short /dev/ttyUSB0 name can change at the next reboot."; else by=$(ls /dev/serial/by-id/ 2>/dev/null | head -1); echo "NOT SEEN inside Home Assistant. Add it to your compose file, under the Home Assistant service:"; echo "  devices:"; if [ -n "$by" ]; then echo "    - /dev/serial/by-id/$by:/dev/serial/by-id/$by"; else echo "    - /dev/ttyUSB0:/dev/ttyUSB0"; fi; echo; echo "Unless the stick is used by Zigbee2MQTT or Z-Wave JS UI: then it belongs to that container, not to Home Assistant, and this is normal."; fi'''
icon_name = "plug"
color = "#dc8add"
show_output = true
tooltip = "The radio stick is plugged in but Home Assistant does not find it? Checks it at both ends - does the server see it, is it handed to the container - and prints the exact line to add if not."

[[button]]
id = "has-070"
name = "Database & disk space"
command = '''sudo docker ps >/dev/null || exit $?; H=$(sudo docker ps --format '{{.Names}}|{{.Image}}' | awk -F'|' 'tolower($2) ~ /(^|\/)home-?assistant(:|@|$)/ {print $1; exit}'); [ -n "$H" ] || { echo "The Home Assistant container is not running."; exit 1; }; echo "=== The history database ==="; db=$(sudo docker exec "$H" sh -c 'ls -l /config/home-assistant_v2.db* 2>/dev/null' | awk '{printf "%-34s %6d MB\n", $9, $5/1048576}'); if [ -n "$db" ]; then printf '%s\n' "$db"; mb=$(sudo docker exec "$H" stat -c %s /config/home-assistant_v2.db 2>/dev/null); mb=$(( ${mb:-0} / 1048576 )); if [ "$mb" -ge 2048 ]; then echo; echo "That is big. Home Assistant keeps 10 days of history by default, so a file this size usually means a few sensors that record every second. Settings > System > Repairs, or exclude them from the recorder."; fi; else echo "No local database file - this Home Assistant uses a separate database server (MariaDB or PostgreSQL), which is measured on its own side."; fi; echo; echo "=== The largest things in the configuration folder ==="; sudo docker exec "$H" sh -c 'cd /config && du -sh .[!.]* * 2>/tmp/cdk.err | sort -h | tail -8; [ -s /tmp/cdk.err ] && echo "(some files could not be read - the real sizes are bigger)"; rm -f /tmp/cdk.err' || exit $?; echo; echo "=== The disk it lives on ==="; rows=$(sudo docker exec "$H" df -h /config) || exit $?; printf '%s\n' "$rows"; pct=$(printf '%s\n' "$rows" | awk 'NR == 2 {gsub(/%/, "", $5); print $5 + 0}'); [ "${pct:-0}" -ge 90 ] && { echo; echo "WARNING: this disk is $pct% full. When it fills, Home Assistant stops recording and can damage its database."; }; exit 0'''
icon_name = "hdd"
color = "#57e389"
show_output = true
timeout = 300
tooltip = "How big the history database has grown, what else fills the configuration folder, and whether the disk is close to full."

[[button]]
id = "has-080"
name = "Are the backups happening?"
command = '''sudo docker ps >/dev/null || exit $?; H=$(sudo docker ps -a --format '{{.Names}}|{{.Image}}' | awk -F'|' 'tolower($2) ~ /(^|\/)home-?assistant(:|@|$)/ {print $1; exit}'); [ -n "$H" ] || { echo "No Home Assistant container on this machine."; exit 1; }; list=$(sudo docker exec "$H" sh -c '[ -d /config/backups ] || exit 3; find /config/backups -maxdepth 1 -type f -name "*.tar" -printf "%T@|%s|%f\n" | sort -n'); rc=$?; if [ $rc -eq 3 ] || { [ $rc -eq 0 ] && [ -z "$list" ]; }; then echo "NO BACKUP AT ALL."; echo; echo "Home Assistant can make them by itself: Settings > System > Backups > Set up automatic backups."; exit 1; fi; [ $rc -eq 0 ] || exit $rc; n=$(printf '%s\n' "$list" | grep -c .); last=$(printf '%s\n' "$list" | tail -1); t=${last%%.*}; f=${last##*|}; now=$(date +%s); h=$(( (now - t) / 3600 )); tot=$(printf '%s\n' "$list" | LC_ALL=C awk -F'|' '{s+=$2} END {printf "%d", s/1048576}'); echo "Backups kept:  $n ($tot MB in all)"; echo "Newest:        $f"; if [ $h -lt 48 ]; then echo "               $h hour(s) old - backups are happening."; else echo "               $((h / 24)) days old."; echo "If you chose weekly backups that can be normal; otherwise AUTOMATIC BACKUPS HAVE STOPPED - look at Settings > System > Backups."; fi; echo; echo "These sit on the same disk as Home Assistant: if that disk dies, they go with it. Settings > System > Backups can also send a copy to network storage."'''
icon_name = "clock-history"
color = "#8ff0a4"
show_output = true
tooltip = "Finds the newest Home Assistant backup and says how old it is, instead of assuming the automatic backups still run."

[[button]]
id = "has-090"
name = "Resources right now"
command = '''sudo docker ps >/dev/null || exit $?; H=$(sudo docker ps --format '{{.Names}}|{{.Image}}' | awk -F'|' 'tolower($2) ~ /(^|\/)home-?assistant(:|@|$)/ {print $1; exit}'); [ -n "$H" ] || { echo "The Home Assistant container is not running."; exit 1; }; sudo docker stats --no-stream "$H"'''
icon_name = "memory"
color = "#8ff0a4"
show_output = true
tooltip = "One snapshot of the processor and memory Home Assistant is using right now."

# ── Acting (rare, and in this order) ──────────────────────────────────────
[[button]]
id = "has-100"
name = "Restart Home Assistant"
command = '''sudo docker ps >/dev/null || exit $?; H=$(sudo docker ps -a --format '{{.Names}}|{{.Image}}' | awk -F'|' 'tolower($2) ~ /(^|\/)home-?assistant(:|@|$)/ {print $1; exit}'); [ -n "$H" ] || { echo "No Home Assistant container on this machine."; exit 1; }; if [ "$(sudo docker inspect -f '{{.State.Running}}' "$H")" = true ]; then PY=$(sudo docker exec "$H" sh -c 'for p in /lsiopy/bin/python3 /usr/local/bin/python3 python3; do "$p" -c "import homeassistant" 2>/dev/null && { echo "$p"; exit 0; }; done'); if [ -n "$PY" ]; then echo "Checking the configuration first..."; out=$(sudo docker exec "$H" "$PY" -m homeassistant --script check_config --config /config 2>&1); rc=$?; if [ $rc -ne 0 ] || ! printf '%s\n' "$out" | grep -qi 'configuration valid' || printf '%s\n' "$out" | grep -qiE 'failed config|invalid config'; then echo; printf '%s\n' "$out" | tail -n 40; echo; echo "NOT RESTARTED: the configuration has problems, and Home Assistant might not come back. Fix them first (Is my configuration valid? shows them again)."; exit 1; fi; echo "Configuration valid."; else echo "(The configuration could not be checked from here - restarting anyway.)"; fi; fi; sudo docker restart "$H" >/dev/null || exit $?; echo "Restarted. Waiting for the web page to answer (up to two minutes)..."; i=0; code=""; while [ $i -lt 24 ]; do command -v curl >/dev/null || { sleep 20; break; }; sleep 5; i=$((i + 1)); code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 4 http://127.0.0.1:8123/ 2>/dev/null); case "$code" in 2??|3??|4??) break;; esac; done; echo; sudo docker ps -a --format '{{.Names}}: {{.Status}}' | grep "^$H:"; case "$code" in 2??|3??|4??) echo "Home Assistant is answering on port 8123.";; *) echo "The container is up, but its page on port 8123 did not answer yet. A big setup takes a few minutes - if it still does not after that, look at Recent errors.";; esac'''
icon_name = "arrow-clockwise"
color = "#f8e45c"
show_output = true
confirm_before_run = true
timeout = 600
tooltip = "Checks the configuration first and refuses to restart if it is broken - the most common way to lose Home Assistant. Then restarts it and waits until its page answers."

[[button]]
id = "has-110"
name = "Update Home Assistant"
command = '''sudo docker ps >/dev/null || exit $?; H=$(sudo docker ps -a --format '{{.Names}}|{{.Image}}' | awk -F'|' 'tolower($2) ~ /(^|\/)home-?assistant(:|@|$)/ {print $1; exit}'); [ -n "$H" ] || { echo "No Home Assistant container on this machine."; exit 1; }; fresh=$(sudo docker exec "$H" sh -c 'find /config/backups -maxdepth 1 -type f -name "*.tar" -mmin -1440 2>/dev/null | head -1'); if [ -z "$fresh" ]; then echo "STOPPED BEFORE UPDATING: there is no Home Assistant backup from the last 24 hours."; echo "Make one first: Settings > System > Backups > Back up now. Then press this button again."; exit 1; fi; echo "Backup from the last 24 hours: ${fresh##*/} - good."; echo; dir=$(sudo docker inspect -f '{{index .Config.Labels "com.docker.compose.project.working_dir"}}' "$H" 2>/dev/null); cf=""; for x in compose.yaml compose.yml docker-compose.yaml docker-compose.yml; do [ -n "$dir" ] && sudo test -f "$dir/$x" && { cf="$x"; break; }; done; if [ -z "$cf" ]; then echo "The compose file for Home Assistant is not reachable from the server."; echo "Update it from Portainer: Stacks > your stack > Update the stack, with 'Re-pull image' turned on."; echo "(A Portainer stack keeps its compose file inside Portainer's own volume, so the server cannot open it.)"; exit 0; fi; echo "Compose folder: $dir"; cd "$dir" && sudo docker compose pull && sudo docker compose up -d || exit $?; echo; echo "Waiting for the web page to answer (up to three minutes)..."; i=0; code=""; while [ $i -lt 36 ]; do command -v curl >/dev/null || { sleep 20; break; }; sleep 5; i=$((i + 1)); code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 4 http://127.0.0.1:8123/ 2>/dev/null); case "$code" in 2??|3??|4??) break;; esac; done; v=$(sudo docker inspect -f '{{index .Config.Labels "io.hass.version"}}' "$H" 2>/dev/null); sudo docker ps -a --format '{{.Names}}: {{.Status}}' | grep "^$H:"; echo "Version now: ${v:-unknown}"; case "$code" in 2??|3??|4??) echo "Home Assistant is answering. Look at What failed to start? once it has settled.";; *) echo "Its page did not answer yet - the first start after an update can take several minutes. Then look at What failed to start?";; esac'''
icon_name = "cloud-download"
color = "#62a0ea"
show_output = true
confirm_before_run = true
timeout = 1800
tooltip = "Refuses to start without a backup from the last 24 hours. Then finds your compose folder by itself, pulls the new version, and waits until Home Assistant answers again."

[[button]]
id = "has-120"
name = "Shell inside the container"
command = '''sudo docker ps >/dev/null || exit $?; H=$(sudo docker ps --format '{{.Names}}|{{.Image}}' | awk -F'|' 'tolower($2) ~ /(^|\/)home-?assistant(:|@|$)/ {print $1; exit}'); [ -n "$H" ] || { echo "The Home Assistant container is not running."; exit 1; }; echo "You are about to get a shell INSIDE the $H container."; echo "Your configuration is in /config. Type exit to leave."; echo; sudo docker exec -it "$H" bash 2>/dev/null || sudo docker exec -it "$H" sh'''
icon_name = "terminal"
color = "#ffa348"
execution_mode = "terminal"
confirm_before_run = true
tooltip = "For the moment when an answer online says \"run this inside the container\". Opens a shell in the Home Assistant container itself, not on the server. You type into it, so it needs a computer."
