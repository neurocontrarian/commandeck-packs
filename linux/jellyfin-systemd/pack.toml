version = 1

[pack]
pack_id = "jellyfin-systemd"
name = "Jellyfin (system install)"
pack_ver = "1.0.15"
os = "linux"
category = "Jellyfin"
description = "The questions you would otherwise SSH in for: is it running, why is it busy, what does the log say - plus restart, update and cache cleanup. For a Jellyfin installed on the machine itself and managed by systemctl."
requires = "Jellyfin installed as a system service (apt/deb package, bare metal, or inside a Proxmox/LXC container), reached over SSH. Running Jellyfin in Docker instead? Install 'Jellyfin (Docker)' - the commands are completely different."
tags = ["jellyfin", "systemd", "lxc", "proxmox", "media-server", "selfhosted", "diagnostics"]

# ── Is it healthy? ────────────────────────────────────────────────────────
[[button]]
id = "jfs-010"
name = "Is Jellyfin running?"
command = '''systemctl status jellyfin --no-pager >/dev/null 2>&1; [ $? = 4 ] && { echo "There is no jellyfin service on this machine."; echo "If Jellyfin runs in Docker here, install the 'Jellyfin (Docker)' pack instead - these commands cannot see inside a container."; exit 0; }; systemctl status jellyfin --no-pager 2>&1 | head -15'''
icon_name = "info-circle"
color = "#62a0ea"
show_output = true
tooltip = "Active or failed, since when, and the last few log lines - the one-glance health check."

[[button]]
id = "jfs-020"
name = "Why is Jellyfin busy?"
command = '''echo "=== Transcoding right now? ==="; line=$(ps -eo comm,pcpu,args --no-headers | awk '$1 ~ /ffmpe/' | head -1); if [ -n "$line" ]; then cpu=$(printf '%s' "$line" | awk '{print $2}'); src=$(printf '%s' "$line" | sed -n 's/.* -i file:\([^ ]*\).*/\1/p'); src=${src##*/}; vc=$(printf '%s' "$line" | sed -n 's/.*-codec:v:0 \([^ ]*\).*/\1/p'); rate=$(printf '%s' "$line" | sed -n 's/.*-maxrate \([0-9]*\).*/\1/p'); echo "Yes - Jellyfin is transcoding right now."; [ -n "$src" ] && echo "  File:   $src"; case "$vc" in copy) echo "  Video:  copied as-is (only the sound or the wrapper is being changed)";; "") : ;; *) echo "  Video:  recompressed with $vc";; esac; [ -n "$rate" ] && echo "  Target: about $((rate / 1000)) kb/s"; case "$cpu" in 0|0.0|"") : ;; *) echo "  CPU:    $cpu% for that one process";; esac; echo "  (Recompressing the picture is what makes a server sweat. If this happens on every play, the client cannot read the original format.)"; else echo "No, nothing is transcoding."; fi; echo; echo "=== Scanning the library right now? ==="; sc=$(ps -eo comm,args --no-headers | awk '$1 ~ /ffprob/' | head -1); if [ -n "$sc" ]; then f=$(printf '%s' "$sc" | sed -n 's/.* file:\([^ ]*\).*/\1/p'); f=${f##*/}; echo "Yes - Jellyfin is reading a file right now${f:+: $f}"; else echo "No ffprobe at this exact second (a scan can still be between files - see below)."; fi; echo; echo "=== Library scan in the recent log ==="; log=$(journalctl -u jellyfin -n 300 --no-pager 2>/dev/null | grep -v "^-- No entries"); [ -n "$log" ] || log=$(sudo journalctl -u jellyfin -n 300 --no-pager) || exit $?; echo "$log" | grep -i scan | tail -5 | grep . || echo "No scan activity in the last 300 log lines."'''
icon_name = "cpu"
color = "#f8e45c"
show_output = true
tooltip = "Noisy drives or a hot CPU? This answers it: transcoding, a library scan, or neither. ffmpeg with nobody watching is usually trickplay (thumbnail previews) being generated."

[[button]]
id = "jfs-030"
name = "Resources right now"
command = '''out=$(systemctl status jellyfin --no-pager | grep -E "Active:|Tasks:|Memory:|CPU:"); [ -n "$out" ] && echo "$out" || echo "No jellyfin service on this machine. If Jellyfin runs in Docker here, install the 'Jellyfin (Docker)' pack instead."'''
icon_name = "activity"
color = "#8ff0a4"
show_output = true
tooltip = "How much memory and CPU time the Jellyfin service has used, straight from systemd."

[[button]]
id = "jfs-040"
name = "Recent errors"
command = '''log=$(journalctl -u jellyfin -n 500 --no-pager 2>/dev/null | grep -v "^-- No entries"); [ -n "$log" ] || log=$(sudo journalctl -u jellyfin -n 500 --no-pager) || exit $?; echo "$log" | grep "\[ERR\]" | tail -20 | grep . || echo "No errors in the last 500 log lines."'''
icon_name = "exclamation-triangle"
color = "#ffbe6f"
show_output = true
tooltip = "Only real errors. Warnings are filtered out on purpose - a healthy Jellyfin prints plenty of harmless ones."

[[button]]
id = "jfs-050"
name = "Full recent log"
command = '''log=$(journalctl -u jellyfin -n 60 --no-pager 2>/dev/null | grep -v "^-- No entries"); [ -n "$log" ] || log=$(sudo journalctl -u jellyfin -n 60 --no-pager) || exit $?; echo "$log"'''
icon_name = "journal-text"
color = "#ffa348"
show_output = true
tooltip = "The raw last 60 lines, unfiltered. Use it when the filtered buttons are not enough - or to copy/paste into your AI assistant or a forum post."

[[button]]
id = "jfs-055"
name = "Follow the log live"
command = '''echo "Reproduce the problem now - Jellyfin writes here as it happens."; echo "Press Ctrl+C - or just leave this view - when you have seen enough."; echo; sudo journalctl -u jellyfin -f -n 40'''
icon_name = "activity"
color = "#ffbe6f"
execution_mode = "terminal"
category = "Jellyfin"
os = "linux"
tooltip = "The log button shows what already happened; this one keeps printing while you press play, so a stutter or a transcode failure is visible at the moment it occurs. Ctrl+C closes it."

[[button]]
id = "jfs-060"
name = "Who is using the drives?"
command = '''export PATH="$PATH:/usr/sbin:/sbin"; if ! command -v iotop >/dev/null; then echo "iotop is missing on this server - installing it now (one-off, from your distribution's repository)."; if command -v apt-get >/dev/null; then sudo apt-get install -y iotop 2>/dev/null || { sudo apt-get update -qq && sudo apt-get install -y iotop; } || exit $?; elif command -v dnf >/dev/null; then sudo dnf install -y iotop || exit $?; elif command -v pacman >/dev/null; then sudo pacman -S --noconfirm iotop || exit $?; elif command -v zypper >/dev/null; then sudo zypper install -y iotop || exit $?; elif command -v apk >/dev/null; then sudo apk add iotop || exit $?; else echo "Unknown package manager - please install iotop yourself."; exit 0; fi; echo "Installed."; echo; fi; echo "Watching the drives for 10 seconds..."; echo; out=$(sudo iotop -boPn10 -d 1 2>&1); rc=$?; case "$out" in *"sudo:"*) printf '%s\n' "$out" >&2; exit 1;; esac; case "$out" in *"Netlink error"*|*CONFIG_TASKSTATS*) echo "This machine cannot say which process is using the drives."; echo; echo "The kernel here does not publish per-process disk statistics. That is normal inside an unprivileged container (a Proxmox LXC, or Docker): the figures exist only on the host machine, so look there instead."; exit 0;; esac; [ "$rc" = 0 ] || { printf '%s\n' "$out" >&2; exit "$rc"; }; [ -n "$out" ] || { echo "iotop reported nothing at all on this machine."; exit 0; }; digest=$(echo "$out" | LC_ALL=C awk 'function mult(u) { return u == "M/s" ? 1048576 : u == "K/s" ? 1024 : u == "G/s" ? 1073741824 : 1 } function human(b) { if (b >= 1048576) return sprintf("%.1f MB/s", b / 1048576); if (b >= 1024) return sprintf("%.0f KB/s", b / 1024); return sprintf("%.0f B/s", b) } /DISK READ:|^ *(PID|TID)/ { next } NF < 8 { next } { r = $4 * mult($5); w = $6 * mult($7); i = 8; while (i <= NF && $i ~ /^([0-9.]+|[BKMG]\/s|%|\?unavailable\?)$/) i++; cmd = $i; if (cmd !~ /^\[/) sub(/.*\//, "", cmd); if (cmd == "") next; if (r > read[cmd]) read[cmd] = r; if (w > write[cmd]) write[cmd] = w } END { n = 0; for (c in read) { top = read[c] > write[c] ? read[c] : write[c]; if (top < 102400) { quiet++; continue } n++; name[n] = c; peak[n] = top } for (a = 1; a <= n; a++) for (b = a + 1; b <= n; b++) if (peak[b] > peak[a]) { t = peak[a]; peak[a] = peak[b]; peak[b] = t; s = name[a]; name[a] = name[b]; name[b] = s } for (a = 1; a <= n && a <= 6; a++) { c = name[a]; printf "%-22s %s\n", c, (read[c] >= write[c] ? "reads  " human(read[c]) : "writes " human(write[c])) } if (n == 0) print "Nothing but background housekeeping (system journal, logs) - no process is really using the drives."; else if (quiet > 0) printf "\n(plus %d background process(es) under 100 KB/s: journal, logs)\n", quiet }'); if echo "$out" | grep -qE "^[[:space:]]*[0-9]+" && ! echo "$digest" | grep -qE "reads |writes "; then echo "$out" | head -40; else echo "$digest"; fi'''
icon_name = "hdd"
color = "#99c1f1"
show_output = true
timeout = 300
tooltip = "Watches the drives for 10 seconds and names the processes that actually used them, with their peak speed. Background noise (journal, Docker, logs) is summarised in one line. Installs the iotop tool by itself the first time."

[[button]]
id = "jfs-070"
name = "Space & transcode cache"
command = '''echo "=== Disks ==="; df -h /var/lib/jellyfin 2>/dev/null || df -h; echo; echo "=== Transcode cache size ==="; out=$(sudo sh -c 'for d in /var/cache/jellyfin/transcodes /var/lib/jellyfin/transcodes /tmp/jellyfin-transcodes; do [ -d "$d" ] && du -sh "$d"; done; :') || exit $?; [ -n "$out" ] && echo "$out" || echo "No transcode folder found - nothing has been transcoded on this install yet."'''
icon_name = "folder2"
color = "#57e389"
show_output = true
tooltip = "Free space where Jellyfin stores its data, plus how much room the transcode cache is eating."

[[button]]
id = "jfs-080"
name = "Hardware acceleration"
command = '''if [ ! -d /dev/dri ]; then echo "No GPU is available to Jellyfin on this machine (there is no /dev/dri)."; echo; echo "Inside a Proxmox LXC or a Docker container, the graphics card has to be passed through from the host first - Jellyfin cannot see it on its own."; echo "Until then hardware transcoding stays off, and there is nothing to change here."; exit 0; fi; echo "=== GPU available? ==="; ls -l /dev/dri; echo; echo "=== Is Jellyfin allowed to use it? ==="; id jellyfin >/dev/null 2>&1 || { echo "There is no jellyfin user on this system - it may run as someone else."; exit 0; }; dev=$(ls /dev/dri/renderD* 2>/dev/null | head -1); [ -n "$dev" ] || dev=$(ls /dev/dri/card* 2>/dev/null | head -1); grp=$(stat -c %G "$dev" 2>/dev/null); [ -n "$grp" ] || { echo "Could not read the owner of $dev."; exit 0; }; if id -nG jellyfin | tr " " "\n" | grep -qx "$grp"; then echo "Jellyfin belongs to the group '$grp', which owns $dev - it is allowed to use the GPU."; else echo "Jellyfin is NOT in the group '$grp', which owns $dev, so it cannot use the GPU."; echo "Fix: sudo usermod -aG $grp jellyfin, then restart Jellyfin."; fi'''
icon_name = "pc-display"
color = "#dc8add"
show_output = true
tooltip = "The two reasons hardware transcoding silently falls back to the CPU: no GPU device, or the jellyfin user is not in the render group."

[[button]]
id = "jfs-090"
name = "Installed plugins"
command = '''out=$(ls -1 /var/lib/jellyfin/plugins 2>/dev/null | grep -v '^configurations$'); [ -n "$out" ] && { echo "Plugins you installed from the catalogue:"; echo "$out"; } || echo "No plugin installed from the catalogue. Jellyfin's built-in metadata providers (TMDb, OMDb, MusicBrainz...) are part of the server and never appear here."'''
icon_name = "stack"
color = "#99c1f1"
show_output = true
timeout = 300
tooltip = "When Jellyfin misbehaves for no visible reason, an added plugin is a frequent culprit. Lists the ones you installed yourself - the built-in metadata providers are not shown."

# ── Acting (rare, and in this order) ──────────────────────────────────────
[[button]]
id = "jfs-100"
name = "Restart Jellyfin"
command = '''systemctl restart jellyfin 2>/dev/null || sudo -n systemctl restart jellyfin 2>/dev/null || { echo COMMANDECK_NEEDS_ADMIN >&2; echo "Restarting Jellyfin needs admin rights."; echo "Easiest fix: save this machine's SSH password in Commandeck (Machines > edit) - admin actions then work automatically."; exit 1; }; sleep 3; systemctl status jellyfin --no-pager | head -8'''
icon_name = "arrow-clockwise"
color = "#f8e45c"
show_output = true
confirm_before_run = true
tooltip = "First move when something is stuck. Anyone watching will be interrupted. Restarts the service and reports its new status."

[[button]]
id = "jfs-110"
name = "Update Jellyfin"
command = '''command -v apt-get >/dev/null || { echo "This machine does not use apt - update Jellyfin with your own package manager."; exit 0; }; sudo apt-get update && sudo apt-get install --only-upgrade -y jellyfin jellyfin-server jellyfin-web || exit $?; echo; sleep 3; systemctl status jellyfin --no-pager | head -8'''
icon_name = "cloud-download"
color = "#62a0ea"
show_output = true
confirm_before_run = true
timeout = 600
tooltip = "Upgrades the Jellyfin packages from the repository you installed them from, then checks the service came back up."

[[button]]
id = "jfs-120"
name = "Clear the transcode cache"
command = '''out=$(sudo sh -c 'found=0; for d in /var/cache/jellyfin/transcodes /var/lib/jellyfin/transcodes /tmp/jellyfin-transcodes; do [ -d "$d" ] || continue; found=1; echo "$d before: $(du -sh "$d" | cut -f1)"; rm -rf "$d"/*; echo "$d after:  $(du -sh "$d" | cut -f1)"; done; [ "$found" = 1 ] || echo "No transcode folder found - nothing to clear."') || exit $?; echo "$out"'''
icon_name = "trash"
color = "#f66151"
show_output = true
confirm_before_run = true
tooltip = "Deletes the temporary transcoding files only - never your media, never your settings. Do not click it while someone is watching."
