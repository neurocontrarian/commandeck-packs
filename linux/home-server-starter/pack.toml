version = 1

[pack]
pack_id = "home-server-starter"
name = "Home Server Starter"
pack_ver = "1.3.0"
os = "linux"
category = "Home Server"
description = "One-click maintenance for a Docker home server over SSH: containers, services, connectivity. Pairs with the Linux defaults."
requires = "A Linux server with Docker (and systemd for the service buttons), reached over SSH by a user allowed to run sudo. The container/service buttons ask you for the name each time you click them."
tags = ["docker", "home-server", "jellyfin", "selfhosted", "ssh"]

# ── Docker ────────────────────────────────────────────────────────────────
[[button]]
id = "hss-010"
name = "Running containers"
command = "sudo docker ps"
icon_name = "box-seam"
color = "#99c1f1"
show_output = true
tooltip = "List currently running Docker containers"

[[button]]
id = "hss-011"
name = "Container resources"
command = "sudo docker stats --no-stream"
icon_name = "activity"
color = "#8ff0a4"
show_output = true
tooltip = "Show CPU, memory and network use per container (one snapshot)"

[[button]]
id = "hss-012"
name = "Restart a container"
command = '''sudo docker restart {{container}} && sleep 3 && sudo docker ps -a --filter name={{container}} --format "{{.Names}}: {{.Status}}"'''
icon_name = "arrow-clockwise"
color = "#ffbe6f"
show_output = true
confirm_before_run = true
tooltip = "Asks for a container name, restarts it, then reports whether it came back up"

[[button]]
id = "hss-013"
name = "Container logs"
command = "sudo docker logs --tail 50 {{container}} 2>&1"
icon_name = "file-text"
color = "#ffa348"
show_output = true
tooltip = "Asks for a container name, shows its last 50 log lines"

[[button]]
id = "hss-014"
name = "Update a container"
command = '''dir=$(sudo docker inspect --format '{{index .Config.Labels "com.docker.compose.project.working_dir"}}' {{container}} 2>/dev/null); if [ -z "$dir" ]; then echo "This container was not created by docker compose."; echo "Update it from Portainer instead: Containers > Recreate, with 'Pull latest image' enabled."; exit 0; fi; echo "Compose folder: $dir"; cd "$dir" && sudo docker compose pull && sudo docker compose up -d && sleep 5 && sudo docker ps -a --filter name={{container}} --format "{{.Names}}: {{.Status}}"'''
icon_name = "cloud-download"
color = "#62a0ea"
show_output = true
confirm_before_run = true
timeout = 600
tooltip = "Asks for a container name, finds its compose folder by itself, pulls the newer image and recreates it. Nothing to configure."

[[button]]
id = "hss-016"
name = "Stop a container"
command = '''sudo docker stop {{container}} && echo "Stopped."'''
icon_name = "power"
color = "#f66151"
show_output = true
confirm_before_run = true
tooltip = "Asks for a container name, then stops it"

[[button]]
id = "hss-015"
name = "Clean up Docker disk"
command = "sudo docker system prune -f"
icon_name = "trash"
color = "#f66151"
show_output = true
confirm_before_run = true
tooltip = "Remove stopped containers, unused networks and dangling images to reclaim disk space"

# ── Services ──────────────────────────────────────────────────────────────
[[button]]
id = "hss-021"
name = "Service status"
command = "systemctl status {{service}} --no-pager | head -20"
icon_name = "info-circle"
color = "#dc8add"
show_output = true
tooltip = "Asks for a systemd service name, shows its status"

[[button]]
id = "hss-022"
name = "Restart a service"
command = '''systemctl restart {{service}} 2>/dev/null || sudo -n systemctl restart {{service}} 2>/dev/null || { echo COMMANDECK_NEEDS_ADMIN >&2; echo "Restarting a service needs admin rights."; echo "Easiest fix: save this machine's SSH password in Commandeck (Machines > edit) - admin actions then work automatically."; exit 1; }; sleep 2; systemctl status {{service}} --no-pager | head -8'''
icon_name = "arrow-clockwise"
color = "#f8e45c"
show_output = true
confirm_before_run = true
tooltip = "Asks for a systemd service name, restarts it, then reports its new status"

[[button]]
id = "hss-023"
name = "Stop a service"
command = '''systemctl stop {{service}} 2>/dev/null || sudo -n systemctl stop {{service}} 2>/dev/null || { echo COMMANDECK_NEEDS_ADMIN >&2; echo "Stopping a service needs admin rights."; echo "Easiest fix: save this machine's SSH password in Commandeck (Machines > edit) - admin actions then work automatically."; exit 1; }; sleep 2; systemctl is-active {{service}}; echo "(inactive = stopped)"'''
icon_name = "power"
color = "#f66151"
show_output = true
confirm_before_run = true
tooltip = "Asks for a systemd service name, then stops it"

# ── Connectivity ──────────────────────────────────────────────────────────
[[button]]
id = "hss-031"
name = "Public IP"
command = "curl -s ifconfig.me"
icon_name = "broadcast"
color = "#57e389"
show_output = true
tooltip = "Show the server's public IP address (is the VPN/proxy on?)"

[[button]]
id = "hss-033"
name = "Internet check"
command = "ping -c 4 1.1.1.1"
icon_name = "wifi"
color = "#62a0ea"
show_output = true
tooltip = "Send 4 test packets to a public server to check internet connectivity"
