version = 1

[pack]
pack_id = "jellyfin-docker"
name = "Jellyfin (Docker)"
pack_ver = "1.0.10"
os = "linux"
category = "Jellyfin"
description = "The questions you would otherwise SSH in for: is it running, why is it busy, what does the log say - plus restart, update and cache cleanup. For a Jellyfin running in a Docker container."
requires = "Jellyfin in a Docker container named jellyfin, reached over SSH by a user allowed to run sudo. Installed Jellyfin with apt, or inside a Proxmox/LXC container? Install 'Jellyfin (system install)' instead - the commands are completely different."
tags = ["jellyfin", "docker", "media-server", "selfhosted", "diagnostics"]

# ── Is it healthy? ────────────────────────────────────────────────────────
[[button]]
id = "jfd-010"
name = "Is Jellyfin running?"
command = '''out=$(sudo docker ps -a --filter name=jellyfin --format "{{.Names}}: {{.Status}}") || exit $?; [ -n "$out" ] && echo "$out" || echo "No container named jellyfin exists on this machine."'''
icon_name = "info-circle"
color = "#62a0ea"
show_output = true
tooltip = "Shows the container and how long it has been up - or why it stopped (Exited 137 = killed, out of memory)."

[[button]]
id = "jfd-020"
name = "Why is Jellyfin busy?"
command = '''echo "=== Transcoding right now? ==="; tr=$(ps -eo comm,pcpu,etime,args --no-headers | awk '$1=="ffmpeg"' | head -5); [ -n "$tr" ] && echo "$tr" || echo "No, nothing is transcoding."; echo; echo "=== Scanning the library right now? ==="; sc=$(ps -eo comm,pcpu,etime,args --no-headers | awk '$1=="ffprobe"' | head -5); [ -n "$sc" ] && echo "$sc" || echo "No ffprobe at this exact second (a scan can still be between files - see below)."; echo; echo "=== Library scan in the recent log ==="; log=$(sudo docker logs --tail 300 jellyfin 2>&1) || { echo "$log" >&2; exit 1; }; echo "$log" | grep -i scan | tail -5 | grep . || echo "No scan activity in the last 300 log lines."'''
icon_name = "cpu"
color = "#f8e45c"
show_output = true
tooltip = "Noisy drives or a hot CPU? This answers it: transcoding, a library scan, or neither. ffmpeg with nobody watching is usually trickplay (thumbnail previews) being generated."

[[button]]
id = "jfd-030"
name = "Resources right now"
command = "sudo docker stats --no-stream jellyfin"
icon_name = "activity"
color = "#8ff0a4"
show_output = true
tooltip = "One snapshot of the CPU, memory, network and disk use of the Jellyfin container."

[[button]]
id = "jfd-040"
name = "Recent errors"
command = '''log=$(sudo docker logs --tail 500 jellyfin 2>&1) || { echo "$log" >&2; exit 1; }; echo "$log" | grep "\[ERR\]" | tail -20 | grep . || echo "No errors in the last 500 log lines."'''
icon_name = "exclamation-triangle"
color = "#ffbe6f"
show_output = true
tooltip = "Only real errors. Warnings are filtered out on purpose - a healthy Jellyfin prints plenty of harmless ones."

[[button]]
id = "jfd-050"
name = "Full recent log"
command = "sudo docker logs --tail 60 jellyfin 2>&1"
icon_name = "journal-text"
color = "#ffa348"
show_output = true
tooltip = "The raw last 60 lines, unfiltered. Use it when the filtered buttons are not enough - or to copy/paste into your AI assistant or a forum post."

[[button]]
id = "jfd-055"
name = "Follow the log live"
command = '''echo "Reproduce the problem now - Jellyfin writes here as it happens."; echo "Press Ctrl+C - or just leave this view - when you have seen enough."; echo; sudo docker logs -f --tail 40 jellyfin 2>&1'''
icon_name = "activity"
color = "#ffbe6f"
execution_mode = "terminal"
category = "Jellyfin"
os = "linux"
tooltip = "The log button shows what already happened; this one keeps printing while you press play, so a stutter or a transcode failure is visible at the moment it occurs. Ctrl+C closes it."

[[button]]
id = "jfd-060"
name = "Who is using the drives?"
command = '''if ! command -v iotop >/dev/null; then echo "iotop is missing on this server - installing it now (one-off, from your distribution's repository)."; if command -v apt-get >/dev/null; then sudo apt-get install -y iotop 2>/dev/null || { sudo apt-get update -qq && sudo apt-get install -y iotop; } || exit $?; elif command -v dnf >/dev/null; then sudo dnf install -y iotop || exit $?; elif command -v pacman >/dev/null; then sudo pacman -S --noconfirm iotop || exit $?; elif command -v zypper >/dev/null; then sudo zypper install -y iotop || exit $?; elif command -v apk >/dev/null; then sudo apk add iotop || exit $?; else echo "Unknown package manager - please install iotop yourself."; exit 0; fi; echo "Installed."; echo; fi; echo "Watching the drives for 10 seconds..."; echo; out=$(sudo iotop -boPn10 -d 1 2>/dev/null) || exit $?; digest=$(echo "$out" | LC_ALL=C awk 'function mult(u) { return u == "M/s" ? 1048576 : u == "K/s" ? 1024 : u == "G/s" ? 1073741824 : 1 } function human(b) { if (b >= 1048576) return sprintf("%.1f MB/s", b / 1048576); if (b >= 1024) return sprintf("%.0f KB/s", b / 1024); return sprintf("%.0f B/s", b) } /DISK READ:|^ *(PID|TID)/ { next } NF < 8 { next } { r = $4 * mult($5); w = $6 * mult($7); i = 8; while (i <= NF && $i ~ /^([0-9.]+|[BKMG]\/s|%|\?unavailable\?)$/) i++; cmd = $i; if (cmd !~ /^\[/) sub(/.*\//, "", cmd); if (cmd == "") next; if (r > read[cmd]) read[cmd] = r; if (w > write[cmd]) write[cmd] = w } END { n = 0; for (c in read) { top = read[c] > write[c] ? read[c] : write[c]; if (top < 102400) { quiet++; continue } n++; name[n] = c; peak[n] = top } for (a = 1; a <= n; a++) for (b = a + 1; b <= n; b++) if (peak[b] > peak[a]) { t = peak[a]; peak[a] = peak[b]; peak[b] = t; s = name[a]; name[a] = name[b]; name[b] = s } for (a = 1; a <= n && a <= 6; a++) { c = name[a]; printf "%-22s %s\n", c, (read[c] >= write[c] ? "reads  " human(read[c]) : "writes " human(write[c])) } if (n == 0) print "Nothing but background housekeeping (system journal, Docker, logs) - no process is really using the drives."; else if (quiet > 0) printf "\n(plus %d background process(es) under 100 KB/s: journal, Docker, logs)\n", quiet }'); if echo "$out" | grep -qE "^[[:space:]]*[0-9]+" && ! echo "$digest" | grep -qE "reads |writes "; then echo "$out" | head -40; else echo "$digest"; fi'''
icon_name = "hdd"
color = "#99c1f1"
show_output = true
timeout = 300
tooltip = "Watches the drives for 10 seconds and names the processes that actually used them, with their peak speed. Background noise (journal, Docker, logs) is summarised in one line. Installs the iotop tool by itself the first time."

[[button]]
id = "jfd-070"
name = "Space & transcode cache"
command = '''sudo docker ps >/dev/null || exit $?; echo "=== Disks Jellyfin can see ==="; sudo docker exec jellyfin df -h /config /media 2>/dev/null || { echo "(container not running - showing the host disks)"; df -h; }; echo; echo "=== Transcode cache size ==="; sudo docker exec jellyfin sh -c 'for d in /config/transcodes /config/data/transcodes /config/cache/transcodes; do [ -d "$d" ] && du -sh "$d"; done' 2>/dev/null | grep . || echo "No transcode folder found (nothing cached, or this image stores it elsewhere)."'''
icon_name = "folder2"
color = "#57e389"
show_output = true
tooltip = "Free space on the config and media volumes, plus how much room the transcode cache is eating."

[[button]]
id = "jfd-080"
name = "Hardware acceleration"
command = '''sudo docker ps >/dev/null || exit $?; echo "=== GPU visible inside the container? ==="; sudo docker exec jellyfin ls -l /dev/dri 2>/dev/null || echo "No /dev/dri inside the container. The GPU is not passed through - add 'devices: - /dev/dri:/dev/dri' to your compose file."; echo; echo "=== Is Jellyfin allowed to use it? ==="; sudo docker exec jellyfin id 2>/dev/null || echo "(container not running)"; echo "The user above must belong to the group that owns /dev/dri/renderD128. If it does not, add that group id with 'group_add' in your compose file."'''
icon_name = "pc-display"
color = "#dc8add"
show_output = true
tooltip = "The two reasons hardware transcoding silently falls back to the CPU: the device is not passed through, or the container user is not in the render group."

[[button]]
id = "jfd-090"
name = "Installed plugins"
command = '''sudo docker ps >/dev/null || exit $?; out=$(sudo docker exec jellyfin sh -c 'ls -1 /config/data/plugins 2>/dev/null || ls -1 /config/plugins 2>/dev/null' | grep -v '^configurations$'); [ -n "$out" ] && { echo "Plugins you installed from the catalogue:"; echo "$out"; } || echo "No plugin installed from the catalogue. Jellyfin's built-in metadata providers (TMDb, OMDb, MusicBrainz...) are part of the server and never appear here."'''
icon_name = "stack"
color = "#99c1f1"
show_output = true
timeout = 300
tooltip = "When Jellyfin misbehaves for no visible reason, an added plugin is a frequent culprit. Lists the ones you installed yourself - the built-in metadata providers are not shown."

# ── Acting (rare, and in this order) ──────────────────────────────────────
[[button]]
id = "jfd-100"
name = "Restart Jellyfin"
command = '''sudo docker restart jellyfin >/dev/null && sleep 3 && sudo docker ps --filter name=jellyfin --format "{{.Names}}: {{.Status}}"'''
icon_name = "arrow-clockwise"
color = "#f8e45c"
show_output = true
confirm_before_run = true
tooltip = "First move when something is stuck. Anyone watching will be interrupted. Restarts the container and reports its new status."

[[button]]
id = "jfd-110"
name = "Update Jellyfin"
command = '''sudo docker ps >/dev/null || exit $?; dir=$(sudo docker inspect --format '{{index .Config.Labels "com.docker.compose.project.working_dir"}}' jellyfin 2>/dev/null); if [ -z "$dir" ] || [ ! -d "$dir" ]; then echo "The compose file for this container is not reachable from the server."; echo "Update it from Portainer: Stacks > your stack > Update the stack, with 'Re-pull image' enabled."; echo "(A Portainer stack keeps its compose file inside Portainer's own volume, so the server cannot open it.)"; exit 0; fi; echo "Compose folder: $dir"; cd "$dir" && sudo docker compose pull && sudo docker compose up -d && sleep 5 && sudo docker ps --filter name=jellyfin --format "{{.Names}}: {{.Status}}"'''
icon_name = "cloud-download"
color = "#62a0ea"
show_output = true
confirm_before_run = true
timeout = 600
tooltip = "Finds your compose folder by itself, pulls the newer image, recreates the container and checks it came back up. Nothing to configure."

[[button]]
id = "jfd-120"
name = "Clear the transcode cache"
command = '''sudo docker ps >/dev/null || exit $?; sudo docker exec jellyfin sh -c 'for d in /config/transcodes /config/data/transcodes /config/cache/transcodes; do [ -d "$d" ] || continue; echo "$d before: $(du -sh "$d" | cut -f1)"; rm -rf "$d"/*; echo "$d after:  $(du -sh "$d" | cut -f1)"; done' 2>/dev/null | grep . || echo "No transcode folder found - nothing to clear."'''
icon_name = "trash"
color = "#f66151"
show_output = true
confirm_before_run = true
tooltip = "Deletes the temporary transcoding files only - never your media, never your settings. Do not click it while someone is watching."

[[button]]
id = "jfd-130"
name = "Shell inside the container"
command = '''echo "You are about to get a shell INSIDE the jellyfin container."; echo "Type exit to leave. Changes outside mounted volumes are lost on the next update."; echo; sudo docker exec -it jellyfin bash 2>/dev/null || sudo docker exec -it jellyfin sh'''
icon_name = "terminal"
color = "#ffa348"
execution_mode = "terminal"
confirm_before_run = true
category = "Jellyfin"
os = "linux"
tooltip = "For the moment when an answer online says \"run this inside the container\". Opens a shell in the jellyfin container itself, not on the server. You type into it, so it needs a computer."
